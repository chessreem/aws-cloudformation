AWSTemplateFormatVersion: '2010-09-09'
Description: Private Amazon EKS cluster running the NGINX microservice in the Frontend VPC

Parameters:
  ClusterName:
    Type: String
    Default: nginx-microservice
    Description: Name of the EKS cluster

  KubernetesVersion:
    Type: String
    Default: '1.34'
    Description: Kubernetes version for the EKS control plane

  NodeInstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type for EKS worker nodes

  NodeDesiredSize:
    Type: Number
    Default: 2
    Description: Desired number of worker nodes

  NodeMinSize:
    Type: Number
    Default: 2
    Description: Minimum number of worker nodes

  NodeMaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of worker nodes

  NginxReplicas:
    Type: Number
    Default: 2
    Description: Number of NGINX application pods

  DynamoDBTableName:
    Type: String
    Default: BackendAppData
    Description: DynamoDB table containing the frontend HTML content

Resources:
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-cluster-role


  FrontendNginxEcrCache:
    Type: AWS::ECR::PullThroughCacheRule
    Properties:
      EcrRepositoryPrefix: public-ecr
      UpstreamRegistryUrl: public.ecr.aws

  NginxEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: public-ecr/nginx/nginx
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: false

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      Policies:
        - PolicyName: ImportNginxPullThroughImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                - ecr:BatchImportUpstreamImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/public-ecr/nginx/nginx
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-node-role

  NginxCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds:
          - !ImportValue Dev-FrontendSubnetId
          - !ImportValue Dev-FrontendSubnetIdB
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
      Tags:
        - Key: Name
          Value: !Ref ClusterName

  NginxNodegroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref NginxCluster
      NodegroupName: !Sub ${ClusterName}-workers
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !ImportValue Dev-FrontendSubnetId
        - !ImportValue Dev-FrontendSubnetIdB
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      DiskSize: 20
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MinSize: !Ref NodeMinSize
        MaxSize: !Ref NodeMaxSize
      Tags:
        Name: !Sub ${ClusterName}-worker

  NginxManifestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ManageNginxAndReadHomepage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !ImportValue Dev-BackendDynamoDBTableArn
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-manifest-role

  NginxManifestClusterIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt NginxCluster.ClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !ImportValue Dev-FrontendSecurityGroupId
      Description: Allow the manifest provider to access the private EKS API

  NginxManifestProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt NginxManifestRole.Arn
      Timeout: 900
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue Dev-FrontendSubnetId
          - !ImportValue Dev-FrontendSubnetIdB
        SecurityGroupIds:
          - !ImportValue Dev-FrontendSecurityGroupId
      Code:
        ZipFile: |
          import base64
          import json
          import time
          import urllib.error
          import urllib.request
          import boto3
          import botocore.session
          from botocore.auth import SigV4QueryAuth
          from botocore.awsrequest import AWSRequest

          def send_response(event, context, success, reason=None):
              body = {
                  "Status": "SUCCESS" if success else "FAILED",
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId", event["LogicalResourceId"]),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": {"ServiceName": "nginx", "NodePort": "30080"} if success else {}
              }
              payload = json.dumps(body).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=payload,
                  headers={"content-type": "", "content-length": str(len(payload))},
                  method="PUT"
              )
              urllib.request.urlopen(request, timeout=30).read()

          def eks_token(cluster_name, region):
              credentials = botocore.session.get_session().get_credentials().get_frozen_credentials()
              request = AWSRequest(
                  method="GET",
                  url=f"https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15",
                  headers={"x-k8s-aws-id": cluster_name}
              )
              SigV4QueryAuth(credentials, "sts", region, expires=60).add_auth(request)
              encoded = base64.urlsafe_b64encode(request.url.encode()).decode().rstrip("=")
              return "k8s-aws-v1." + encoded

          def api_request(endpoint, ca_data, token, path, method, body=None):
              payload = None if body is None else json.dumps(body).encode()
              headers = {"Authorization": "Bearer " + token, "Accept": "application/json"}
              if payload is not None:
                  headers["Content-Type"] = "application/apply-patch+yaml"
              request = urllib.request.Request(endpoint + path, data=payload, headers=headers, method=method)
              context = __import__("ssl").create_default_context(cadata=base64.b64decode(ca_data).decode())
              try:
                  with urllib.request.urlopen(request, context=context, timeout=30) as result:
                      return json.loads(result.read() or b"{}")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode()
                  if error.code == 404 and method in ("DELETE", "GET"):
                      return {}
                  raise RuntimeError(f"Kubernetes API {method} {path} failed ({error.code}): {detail}")

          def sync_homepage(endpoint, ca_data, token, table_name):
              dynamodb = boto3.client("dynamodb")
              item = dynamodb.get_item(
                  TableName=table_name,
                  Key={"id": {"S": "homepage"}},
                  ConsistentRead=True
              ).get("Item", {})
              html = item.get("html", {}).get("S")
              if not html:
                  html = "<h1>NGINX is running on Amazon EKS</h1><p>Homepage content was empty in DynamoDB.</p>"
                  dynamodb.put_item(
                      TableName=table_name,
                      Item={"id": {"S": "homepage"}, "html": {"S": html}}
                  )

              path = "/api/v1/namespaces/default/configmaps/nginx-homepage"
              current = api_request(endpoint, ca_data, token, path, "GET")
              if current.get("data", {}).get("index.html") != html:
                  config_map = {
                      "apiVersion": "v1",
                      "kind": "ConfigMap",
                      "metadata": {"name": "nginx-homepage", "namespace": "default"},
                      "data": {"index.html": html}
                  }
                  api_request(endpoint, ca_data, token, path + "?fieldManager=cloudformation&force=true", "PATCH", config_map)

          def handler(event, context):
              props = event.get("ResourceProperties", event)
              cluster_name = props["ClusterName"]
              region = boto3.session.Session().region_name
              eks = boto3.client("eks", region_name=region)
              try:
                  cluster = eks.describe_cluster(name=cluster_name)["cluster"]
                  endpoint = cluster["endpoint"]
                  ca_data = cluster["certificateAuthority"]["data"]
                  token = eks_token(cluster_name, region)

                  if "RequestType" not in event:
                      sync_homepage(endpoint, ca_data, token, event["TableName"])
                      return

                  deployment_path = "/apis/apps/v1/namespaces/default/deployments/nginx"
                  service_path = "/api/v1/namespaces/default/services/nginx"

                  if event["RequestType"] == "Delete":
                      api_request(endpoint, ca_data, token, service_path, "DELETE")
                      api_request(endpoint, ca_data, token, deployment_path, "DELETE")
                      send_response(event, context, True)
                      return

                  replicas = int(props["Replicas"])
                  sync_homepage(endpoint, ca_data, token, props["TableName"])
                  deployment = {
                      "apiVersion": "apps/v1",
                      "kind": "Deployment",
                      "metadata": {"name": "nginx", "namespace": "default", "labels": {"app": "nginx"}},
                      "spec": {
                          "replicas": replicas,
                          "selector": {"matchLabels": {"app": "nginx"}},
                          "template": {
                              "metadata": {"labels": {"app": "nginx"}},
                                "spec": {
                                  "containers": [{
                                    "name": "nginx",
                                    "image": props["ImageUri"],
                                    "ports": [{"name": "http", "containerPort": 80}],
                                    "resources": {
                                      "requests": {"cpu": "100m", "memory": "128Mi"},
                                      "limits": {"cpu": "500m", "memory": "256Mi"}
                                    },
                                    "volumeMounts": [{
                                      "name": "homepage",
                                        "mountPath": "/usr/share/nginx/html",
                                      "readOnly": True
                                    }]
                                  }],
                                  "volumes": [{
                                    "name": "homepage",
                                    "configMap": {
                                      "name": "nginx-homepage",
                                      "items": [{"key": "index.html", "path": "index.html"}]
                                    }
                                  }]
                                }
                          }
                      }
                  }
                  service = {
                      "apiVersion": "v1",
                      "kind": "Service",
                      "metadata": {"name": "nginx", "namespace": "default", "labels": {"app": "nginx"}},
                      "spec": {
                          "type": "NodePort",
                          "selector": {"app": "nginx"},
                          "ports": [{"name": "http", "port": 80, "targetPort": 80, "nodePort": 30080, "protocol": "TCP"}]
                      }
                  }
                  query = "?fieldManager=cloudformation&force=true"
                  api_request(endpoint, ca_data, token, deployment_path + query, "PATCH", deployment)
                  api_request(endpoint, ca_data, token, service_path + query, "PATCH", service)

                  deadline = time.time() + 600
                  while time.time() < deadline:
                      token = eks_token(cluster_name, region)
                      state = api_request(endpoint, ca_data, token, deployment_path, "GET")
                      if state.get("status", {}).get("availableReplicas", 0) >= replicas:
                          send_response(event, context, True)
                          return
                      time.sleep(10)
                  raise RuntimeError("Timed out waiting for NGINX replicas to become available")
              except Exception as error:
                  if "RequestType" in event:
                      send_response(event, context, False, str(error))
                  else:
                      raise

  NginxHomepageSyncSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Keep the NGINX homepage synchronized with DynamoDB
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NginxManifestProvider.Arn
          Id: SyncNginxHomepage
          Input: !Sub '{"ClusterName":"${ClusterName}","TableName":"${DynamoDBTableName}"}'

  NginxHomepageSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NginxManifestProvider
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NginxHomepageSyncSchedule.Arn

  NginxManifestAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: NginxNodegroup
    Properties:
      ClusterName: !Ref NginxCluster
      PrincipalArn: !GetAtt NginxManifestRole.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          AccessScope:
            Type: namespace
            Namespaces:
              - default

  NginxApplication:
    Type: Custom::NginxApplication
    DependsOn:
      - NginxNodegroup
      - NginxManifestAccessEntry
      - NginxManifestClusterIngress
      - NginxEcrRepository
    Properties:
      ServiceToken: !GetAtt NginxManifestProvider.Arn
      ClusterName: !Ref NginxCluster
      Replicas: !Ref NginxReplicas
      TableName: !Ref DynamoDBTableName
      ImageUri: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/public-ecr/nginx/nginx:1.27-alpine

Outputs:
  EksClusterName:
    Description: EKS cluster name
    Value: !Ref NginxCluster
    Export:
      Name: Dev-EksClusterName

  EksClusterEndpoint:
    Description: Private Kubernetes API endpoint
    Value: !GetAtt NginxCluster.Endpoint

  EksClusterSecurityGroupId:
    Description: EKS cluster security group ID
    Value: !GetAtt NginxCluster.ClusterSecurityGroupId
    Export:
      Name: Dev-EksClusterSecurityGroupId

  EksNodegroupName:
    Description: Managed node group name
    Value: !GetAtt NginxNodegroup.NodegroupName
    Export:
      Name: Dev-EksNodegroupName

  NginxServiceName:
    Description: Kubernetes NodePort service name
    Value: !GetAtt NginxApplication.ServiceName

  NginxNodePort:
    Description: NodePort used by the NGINX service
    Value: !GetAtt NginxApplication.NodePort