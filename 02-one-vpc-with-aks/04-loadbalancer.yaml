AWSTemplateFormatVersion: '2010-09-09'
Description: Internet-facing ALB in the Security VPC fronting the frontend EC2 instance across the Transit Gateway

Parameters: {}

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP/HTTPS to the ALB and outbound to the frontend instance
      VpcId: !ImportValue Dev-SecurityVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ALB-SG

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: FrontendTargetGroup
      TargetType: ip
      VpcId: !ImportValue Dev-SecurityVpcId
      Protocol: HTTP
      Port: 80
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200-399'
      Targets:
        - Id: !ImportValue Dev-FrontendInstancePrivateIp
          Port: 80
          AvailabilityZone: all
      Tags:
        - Key: Name
          Value: Frontend-TargetGroup

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: SecurityFrontendAlb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !ImportValue Dev-SecurityPublicSubnetId
        - !ImportValue Dev-SecurityPublicSubnetIdB
      Tags:
        - Key: Name
          Value: Security-Frontend-ALB

Outputs:
  ApplicationLoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: Dev-ApplicationLoadBalancerDnsName

  ApplicationLoadBalancerArn:
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: Dev-ApplicationLoadBalancerArn

  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: Dev-AlbSecurityGroupId
