AWSTemplateFormatVersion: '2010-09-09'
Description: One VPC with two public ALB subnets, two private frontend subnets, and a private backend subnet

Parameters:
  MainVpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the shared VPC

  SecurityPublicSubnetCidr:
    Type: String
    Default: 10.20.0.0/24
    Description: Public subnet A for the internet-facing ALB

  SecurityPublicSubnetCidrB:
    Type: String
    Default: 10.20.1.0/24
    Description: Public subnet B for the internet-facing ALB

  FrontendSubnetCidr:
    Type: String
    Default: 10.20.2.0/24
    Description: Private subnet for the frontend application instance

  FrontendSubnetCidrB:
    Type: String
    Default: 10.20.4.0/24
    Description: Second private frontend subnet in another Availability Zone

  BackendSubnetCidr:
    Type: String
    Default: 10.20.3.0/24
    Description: Private backend subnet for backend workloads

Resources:
  SecurityVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref MainVpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: Main-VPC

  SecurityInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Application-IGW

  SecurityVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SecurityVPC
      InternetGatewayId: !Ref SecurityInternetGateway

  SecurityPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SecurityVPC
      CidrBlock: !Ref SecurityPublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-A

  SecurityPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SecurityVPC
      CidrBlock: !Ref SecurityPublicSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-B

  FrontendSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SecurityVPC
      CidrBlock: !Ref FrontendSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private-App-Subnet

  FrontendSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SecurityVPC
      CidrBlock: !Ref FrontendSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private-App-Subnet-B

  BackendSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SecurityVPC
      CidrBlock: !Ref BackendSubnetCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private-Backend-Subnet

  SecurityPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SecurityVPC
      Tags:
        - Key: Name
          Value: Public-RT

  SecurityPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: SecurityVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref SecurityPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SecurityInternetGateway

  SecurityPublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SecurityPublicSubnet
      RouteTableId: !Ref SecurityPublicRouteTable

  SecurityPublicSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SecurityPublicSubnetB
      RouteTableId: !Ref SecurityPublicRouteTable

  FrontendRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SecurityVPC
      Tags:
        - Key: Name
          Value: Private-App-RT

  FrontendSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FrontendSubnet
      RouteTableId: !Ref FrontendRouteTable

  FrontendSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FrontendSubnetB
      RouteTableId: !Ref FrontendRouteTable

  BackendRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SecurityVPC
      Tags:
        - Key: Name
          Value: Private-Backend-RT

  BackendSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BackendSubnet
      RouteTableId: !Ref BackendRouteTable


  PrivateServiceEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow private workloads to reach AWS service endpoints over HTTPS
      VpcId: !Ref SecurityVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref FrontendSubnetCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref FrontendSubnetCidrB
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref BackendSubnetCidr
      Tags:
        - Key: Name
          Value: Private-Service-Endpoints-SG

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref FrontendSubnet
        - !Ref FrontendSubnetB
      SecurityGroupIds:
        - !Ref PrivateServiceEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ECR-API-Endpoint

  EcrDockerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref FrontendSubnet
        - !Ref FrontendSubnetB
      SecurityGroupIds:
        - !Ref PrivateServiceEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ECR-Docker-Endpoint

  EksApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.eks
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref FrontendSubnet
        - !Ref FrontendSubnetB
      SecurityGroupIds:
        - !Ref PrivateServiceEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: EKS-API-Endpoint

  StsApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref FrontendSubnet
        - !Ref FrontendSubnetB
      SecurityGroupIds:
        - !Ref PrivateServiceEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: STS-API-Endpoint

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref FrontendSubnet
        - !Ref FrontendSubnetB
      SecurityGroupIds:
        - !Ref PrivateServiceEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: CloudWatch-Logs-Endpoint

  NginxPublicEcrCache:
    Type: AWS::ECR::PullThroughCacheRule
    Properties:
      EcrRepositoryPrefix: public-ecr
      UpstreamRegistryUrl: public.ecr.aws

  FrontendS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref FrontendRouteTable
        - !Ref BackendRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - arn:aws:s3:::*
              - arn:aws:s3:::*/*
      Tags:
        - Key: Name
          Value: App-S3-Endpoint

  FrontendDynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SecurityVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref FrontendRouteTable
        - !Ref BackendRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:DescribeTable
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource: '*'
      Tags:
        - Key: Name
          Value: App-DynamoDB-Endpoint

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and HTTPS traffic to the private frontend from this VPC
      VpcId: !Ref SecurityVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MainVpcCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref MainVpcCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Frontend-SG

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow backend application traffic from the frontend subnet
      VpcId: !Ref SecurityVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref FrontendSubnetCidr
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref FrontendSubnetCidrB
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref FrontendSubnetCidr
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref FrontendSubnetCidrB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Backend-SG

# Stack outputs expose the shared VPC and its subnet IDs.
Outputs:
  MainVpcId:
    Value: !Ref SecurityVPC
    Export:
      Name: Dev-MainVpcId

  FrontendVpcId:
    Value: !Ref SecurityVPC
    Export:
      Name: Dev-FrontendVpcId

  BackendVpcId:
    Value: !Ref SecurityVPC
    Export:
      Name: Dev-BackendVpcId

  MainPublicSubnetId:
    Value: !Ref SecurityPublicSubnet
    Export:
      Name: Dev-MainPublicSubnetId

  MainPublicSubnetIdB:
    Value: !Ref SecurityPublicSubnetB
    Export:
      Name: Dev-MainPublicSubnetIdB

  MainPrivateSubnetId:
    Value: !Ref FrontendSubnet
    Export:
      Name: Dev-MainPrivateSubnetId

  FrontendSubnetId:
    Value: !Ref FrontendSubnet
    Export:
      Name: Dev-FrontendSubnetId

  FrontendSubnetIdB:
    Value: !Ref FrontendSubnetB
    Export:
      Name: Dev-FrontendSubnetIdB

  FrontendRouteTableId:
    Value: !Ref FrontendRouteTable
    Export:
      Name: Dev-FrontendRouteTableId

  BackendSubnetId:
    Value: !Ref BackendSubnet
    Export:
      Name: Dev-BackendSubnetId

  BackendRouteTableId:
    Value: !Ref BackendRouteTable
    Export:
      Name: Dev-BackendRouteTableId

  FrontendSecurityGroupId:
    Value: !Ref FrontendSecurityGroup
    Export:
      Name: Dev-FrontendSecurityGroupId

  BackendSecurityGroupId:
    Value: !Ref BackendSecurityGroup
    Export:
      Name: Dev-BackendSecurityGroupId

  NginxImageUri:
    Description: Private ECR pull-through cache URI for the NGINX container image
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/public-ecr/nginx/nginx:1.27-alpine
    Export:
      Name: Dev-NginxImageUri