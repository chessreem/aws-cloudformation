AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon EKS cluster running the NGINX microservice in private subnets

Parameters:
  ClusterName:
    Type: String
    Default: nginx-microservice
    Description: Name of the EKS cluster

  KubernetesVersion:
    Type: String
    Default: '1.34'
    Description: Kubernetes version for the EKS control plane

  NodeInstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type for EKS worker nodes

  NodeDesiredSize:
    Type: Number
    Default: 2
    Description: Desired number of worker nodes

  NodeMinSize:
    Type: Number
    Default: 2
    Description: Minimum number of worker nodes

  NodeMaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of worker nodes

  NginxReplicas:
    Type: Number
    Default: 2
    Description: Number of NGINX application pods

  ClusterPublicAccessCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0
    Description: CIDR ranges allowed to reach the public Kubernetes API endpoint; restrict this for production

  FrontendSubnetId:
    Type: String
    Description: ID of the private frontend subnet

  FrontendSubnetIdB:
    Type: String
    Description: ID of the second private frontend subnet in another Availability Zone

  FrontendSecurityGroupId:
    Type: String
    Description: Existing frontend security group with outbound access

  NginxImageUri:
    Type: String
    Description: Private ECR pull-through cache URI for the NGINX image

Resources:
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-cluster-role

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      Policies:
        - PolicyName: ImportNginxPullThroughImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:BatchImportUpstreamImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/public-ecr/nginx/nginx
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-node-role

  NginxCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref FrontendSubnetId
          - !Ref FrontendSubnetIdB
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: !Ref ClusterPublicAccessCidrs
      Tags:
        - Key: Name
          Value: !Ref ClusterName

  NginxNodegroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref NginxCluster
      NodegroupName: !Sub ${ClusterName}-workers
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !Ref FrontendSubnetId
        - !Ref FrontendSubnetIdB
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      DiskSize: 20
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MinSize: !Ref NodeMinSize
        MaxSize: !Ref NodeMaxSize
      Tags:
        Name: !Sub ${ClusterName}-worker

  NginxManifestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DescribeEksCluster
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-manifest-role

  NginxManifestClusterIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt NginxCluster.ClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref FrontendSecurityGroupId
      Description: Allow the manifest provider to access the EKS Kubernetes API

  NginxManifestProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt NginxManifestRole.Arn
      Timeout: 900
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !Ref FrontendSubnetId
          - !Ref FrontendSubnetIdB
        SecurityGroupIds:
          - !Ref FrontendSecurityGroupId
      Code:
        ZipFile: |
          import base64
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import boto3
          import botocore.session
          from botocore.auth import SigV4QueryAuth
          from botocore.awsrequest import AWSRequest

          def response(event, context, success, data=None, reason=None):
              body = {
                  "Status": "SUCCESS" if success else "FAILED",
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId", event["LogicalResourceId"]),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {}
              }
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=json.dumps(body).encode(),
                  headers={"content-type": "", "content-length": str(len(json.dumps(body).encode()))},
                  method="PUT"
              )
              urllib.request.urlopen(request, timeout=30).read()

          def eks_token(cluster_name, region):
              session = botocore.session.get_session()
              credentials = session.get_credentials().get_frozen_credentials()
              request = AWSRequest(
                  method="GET",
                  url=f"https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15",
                  headers={"x-k8s-aws-id": cluster_name}
              )
              SigV4QueryAuth(credentials, "sts", region, expires=60).add_auth(request)
              encoded = base64.urlsafe_b64encode(request.url.encode()).decode().rstrip("=")
              return "k8s-aws-v1." + encoded

          def api_request(endpoint, ca_data, token, path, method, body=None):
              url = endpoint + path
              payload = None if body is None else json.dumps(body).encode()
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json"
              }
              if payload is not None:
                  headers["Content-Type"] = "application/apply-patch+yaml"
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              context = __import__("ssl").create_default_context(
                  cadata=base64.b64decode(ca_data).decode()
              )
              try:
                  with urllib.request.urlopen(request, context=context, timeout=30) as result:
                      return json.loads(result.read() or b"{}")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode()
                  if error.code == 404 and method == "DELETE":
                      return {}
                  raise RuntimeError(f"Kubernetes API {method} {path} failed ({error.code}): {detail}")

          def handler(event, context):
              props = event["ResourceProperties"]
              cluster_name = props["ClusterName"]
              desired = int(props["Replicas"])
              region = boto3.session.Session().region_name
              eks = boto3.client("eks", region_name=region)
              try:
                  cluster = eks.describe_cluster(name=cluster_name)["cluster"]
                  token = eks_token(cluster_name, region)
                  endpoint = cluster["endpoint"]
                  ca_data = cluster["certificateAuthority"]["data"]
                  deployment_path = "/apis/apps/v1/namespaces/default/deployments/nginx"
                  service_path = "/api/v1/namespaces/default/services/nginx"
                  if event["RequestType"] == "Delete":
                      api_request(endpoint, ca_data, token, service_path, "DELETE")
                      api_request(endpoint, ca_data, token, deployment_path, "DELETE")
                      response(event, context, True)
                      return

                  deployment = {
                      "apiVersion": "apps/v1",
                      "kind": "Deployment",
                      "metadata": {"name": "nginx", "namespace": "default", "labels": {"app": "nginx"}},
                      "spec": {
                          "replicas": desired,
                          "selector": {"matchLabels": {"app": "nginx"}},
                          "template": {
                              "metadata": {"labels": {"app": "nginx"}},
                              "spec": {"containers": [{
                                  "name": "nginx",
                                  "image": props["ImageUri"],
                                  "ports": [{"name": "http", "containerPort": 80}],
                                  "resources": {
                                      "requests": {"cpu": "100m", "memory": "128Mi"},
                                      "limits": {"cpu": "500m", "memory": "256Mi"}
                                  }
                              }]}
                          }
                      }
                  }
                  service = {
                      "apiVersion": "v1",
                      "kind": "Service",
                      "metadata": {"name": "nginx", "namespace": "default", "labels": {"app": "nginx"}},
                      "spec": {
                          "type": "NodePort",
                          "selector": {"app": "nginx"},
                          "ports": [{"name": "http", "port": 80, "targetPort": 80, "nodePort": 30080, "protocol": "TCP"}]
                      }
                  }
                  query = "?fieldManager=cloudformation&force=true"
                  api_request(endpoint, ca_data, token, deployment_path + query, "PATCH", deployment)
                  api_request(endpoint, ca_data, token, service_path + query, "PATCH", service)

                  deadline = time.time() + 600
                  while time.time() < deadline:
                      token = eks_token(cluster_name, region)
                      state = api_request(endpoint, ca_data, token, deployment_path, "GET")
                      available = state.get("status", {}).get("availableReplicas", 0)
                      if available >= desired:
                          response(event, context, True, {"ServiceName": "nginx", "NodePort": "30080"})
                          return
                      time.sleep(10)
                  raise RuntimeError("Timed out waiting for NGINX replicas to become available")
              except Exception as error:
                  response(event, context, False, reason=str(error))

  NginxManifestAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: NginxNodegroup
    Properties:
      ClusterName: !Ref NginxCluster
      PrincipalArn: !GetAtt NginxManifestRole.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          AccessScope:
            Type: namespace
            Namespaces:
              - default

  NginxApplication:
    Type: Custom::NginxApplication
    DependsOn:
      - NginxNodegroup
      - NginxManifestAccessEntry
      - NginxManifestClusterIngress
    Properties:
      ServiceToken: !GetAtt NginxManifestProvider.Arn
      ClusterName: !Ref NginxCluster
      Replicas: !Ref NginxReplicas
      ImageUri: !Ref NginxImageUri

Outputs:
  EksClusterName:
    Description: EKS cluster name
    Value: !Ref NginxCluster
    Export:
      Name: Dev-EksClusterName

  EksClusterEndpoint:
    Description: Kubernetes API endpoint
    Value: !GetAtt NginxCluster.Endpoint

  EksClusterSecurityGroupId:
    Description: EKS cluster security group ID
    Value: !GetAtt NginxCluster.ClusterSecurityGroupId
    Export:
      Name: Dev-EksClusterSecurityGroupId

  EksNodegroupName:
    Description: Managed node group name
    Value: !Ref NginxNodegroup
    Export:
      Name: Dev-EksNodegroupName

  NginxServiceName:
    Description: Kubernetes NodePort service name
    Value: !GetAtt NginxApplication.ServiceName

  NginxNodePort:
    Description: NodePort used by the NGINX service
    Value: !GetAtt NginxApplication.NodePort
