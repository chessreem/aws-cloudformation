AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy the single-VPC NGINX microservice on Amazon EKS behind an Application Load Balancer

Parameters:
  MainVpcCidr:
    Type: String
    Default: 10.20.0.0/16
  SecurityPublicSubnetCidr:
    Type: String
    Default: 10.20.0.0/24
  SecurityPublicSubnetCidrB:
    Type: String
    Default: 10.20.1.0/24
  FrontendSubnetCidr:
    Type: String
    Default: 10.20.2.0/24
  FrontendSubnetCidrB:
    Type: String
    Default: 10.20.4.0/24
  BackendSubnetCidr:
    Type: String
    Default: 10.20.3.0/24
  TableName:
    Type: String
    Default: BackendAppData
  ClusterName:
    Type: String
    Default: nginx-microservice
  KubernetesVersion:
    Type: String
    Default: '1.34'
  NodeInstanceType:
    Type: String
    Default: t3.small
  NodeDesiredSize:
    Type: Number
    Default: 2
  NodeMinSize:
    Type: Number
    Default: 2
  NodeMaxSize:
    Type: Number
    Default: 3
  NginxReplicas:
    Type: Number
    Default: 2
  ClusterPublicAccessCidrs:
    Type: String
    Default: 0.0.0.0/0
  DeployApplication:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: Enable the EKS and load balancer stacks after the NGINX image cache is populated

Conditions:
  DeployApplicationCondition: !Equals [!Ref DeployApplication, 'true']

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./01-network.yaml
      Parameters:
        MainVpcCidr: !Ref MainVpcCidr
        SecurityPublicSubnetCidr: !Ref SecurityPublicSubnetCidr
        SecurityPublicSubnetCidrB: !Ref SecurityPublicSubnetCidrB
        FrontendSubnetCidr: !Ref FrontendSubnetCidr
        FrontendSubnetCidrB: !Ref FrontendSubnetCidrB
        BackendSubnetCidr: !Ref BackendSubnetCidr

  DynamoDBStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: ./02-dynamodb.yaml
      Parameters:
        TableName: !Ref TableName

  EksStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployApplicationCondition
    DependsOn: DynamoDBStack
    Properties:
      TemplateURL: ./03-eks.yaml
      Parameters:
        ClusterName: !Ref ClusterName
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        NodeDesiredSize: !Ref NodeDesiredSize
        NodeMinSize: !Ref NodeMinSize
        NodeMaxSize: !Ref NodeMaxSize
        NginxReplicas: !Ref NginxReplicas
        ClusterPublicAccessCidrs: !Ref ClusterPublicAccessCidrs
        FrontendSubnetId: !GetAtt NetworkStack.Outputs.FrontendSubnetId
        FrontendSubnetIdB: !GetAtt NetworkStack.Outputs.FrontendSubnetIdB
        FrontendSecurityGroupId: !GetAtt NetworkStack.Outputs.FrontendSecurityGroupId
        NginxImageUri: !GetAtt NetworkStack.Outputs.NginxImageUri

  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployApplicationCondition
    Properties:
      TemplateURL: ./04-loadbalancer.yaml
      Parameters:
        MainVpcId: !GetAtt NetworkStack.Outputs.MainVpcId
        MainPublicSubnetId: !GetAtt NetworkStack.Outputs.MainPublicSubnetId
        MainPublicSubnetIdB: !GetAtt NetworkStack.Outputs.MainPublicSubnetIdB
        EksClusterSecurityGroupId: !GetAtt EksStack.Outputs.EksClusterSecurityGroupId
        EksClusterName: !GetAtt EksStack.Outputs.EksClusterName
        EksNodegroupName: !GetAtt EksStack.Outputs.EksNodegroupName

Outputs:
  ApplicationLoadBalancerDnsName:
    Condition: DeployApplicationCondition
    Description: DNS name of the application load balancer
    Value: !GetAtt LoadBalancerStack.Outputs.ApplicationLoadBalancerDnsName
  ApplicationLoadBalancerUrl:
    Condition: DeployApplicationCondition
    Description: URL of the application
    Value: !Sub http://${LoadBalancerStack.Outputs.ApplicationLoadBalancerDnsName}
  EksClusterName:
    Condition: DeployApplicationCondition
    Description: Name of the Amazon EKS cluster
    Value: !GetAtt EksStack.Outputs.EksClusterName