AWSTemplateFormatVersion: '2010-09-09'
Description: Internet-facing ALB forwarding HTTP traffic to the EKS NGINX NodePort service

Parameters:
  MainVpcId:
    Type: String
  MainPublicSubnetId:
    Type: String
  MainPublicSubnetIdB:
    Type: String
  EksClusterSecurityGroupId:
    Type: String
  EksClusterName:
    Type: String
  EksNodegroupName:
    Type: String

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP/HTTPS to the NGINX application load balancer
      VpcId: !Ref MainVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ALB-SG

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: NginxTargetGroup
      TargetType: instance
      VpcId: !Ref MainVpcId
      Protocol: HTTP
      Port: 30080
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200-399'
      Tags:
        - Key: Name
          Value: Nginx-TargetGroup

  NginxNodePortIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EksClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 30080
      ToPort: 30080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Allow the ALB to reach the NGINX Kubernetes NodePort

  TargetRegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RegisterEksNodegroupTargets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeNodegroup
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/${Cluster}/${Nodegroup}/*
                    - Cluster: !Ref EksClusterName
                      Nodegroup: !Ref EksNodegroupName
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:AttachLoadBalancerTargetGroups
                  - autoscaling:DetachLoadBalancerTargetGroups
                Resource: '*'

  TargetRegistrationProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TargetRegistrationRole.Arn
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          def send_response(event, context, status, reason=None):
              body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId", event["LogicalResourceId"]),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": {}
              }
              payload = json.dumps(body).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=payload,
                  headers={"content-type": "", "content-length": str(len(payload))},
                  method="PUT"
              )
              urllib.request.urlopen(request, timeout=30).read()

          def group_names(eks, cluster_name, nodegroup_name):
              result = eks.describe_nodegroup(clusterName=cluster_name, nodegroupName=nodegroup_name)
              return [item["name"] for item in result["nodegroup"]["resources"]["autoScalingGroups"]]

          def update(autoscaling, names, target_group_arn, attach):
              for name in names:
                  if attach:
                      autoscaling.attach_load_balancer_target_groups(
                          AutoScalingGroupName=name,
                          TargetGroupARNs=[target_group_arn]
                      )
                  else:
                      autoscaling.detach_load_balancer_target_groups(
                          AutoScalingGroupName=name,
                          TargetGroupARNs=[target_group_arn]
                      )

          def handler(event, context):
              props = event["ResourceProperties"]
              eks = boto3.client("eks")
              autoscaling = boto3.client("autoscaling")
              try:
                  cluster_name = props["ClusterName"]
                  nodegroup_name = props["NodegroupName"]
                  target_group_arn = props["TargetGroupArn"]
                  if event["RequestType"] == "Delete":
                      update(autoscaling, group_names(eks, cluster_name, nodegroup_name), target_group_arn, False)
                  else:
                      old = event.get("OldResourceProperties", {})
                      if old and old.get("TargetGroupArn") and old.get("NodegroupName"):
                          old_names = group_names(eks, old["ClusterName"], old["NodegroupName"])
                          update(autoscaling, old_names, old["TargetGroupArn"], False)
                      update(autoscaling, group_names(eks, cluster_name, nodegroup_name), target_group_arn, True)
                  send_response(event, context, "SUCCESS")
              except Exception as error:
                  send_response(event, context, "FAILED", str(error))

  NginxNodegroupTargetRegistration:
    Type: Custom::NginxNodegroupTargetRegistration
    DependsOn:
      - NginxNodePortIngress
    Properties:
      ServiceToken: !GetAtt TargetRegistrationProvider.Arn
      ClusterName: !Ref EksClusterName
      NodegroupName: !Ref EksNodegroupName
      TargetGroupArn: !Ref AlbTargetGroup

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: NginxApplicationAlb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref MainPublicSubnetId
        - !Ref MainPublicSubnetIdB
      Tags:
        - Key: Name
          Value: NGINX-Application-ALB

Outputs:
  ApplicationLoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: Dev-ApplicationLoadBalancerDnsName

  ApplicationLoadBalancerArn:
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: Dev-ApplicationLoadBalancerArn

  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: Dev-AlbSecurityGroupId
