AWSTemplateFormatVersion: '2010-09-09'
Description: Lowest-cost DynamoDB table

Parameters:
  TableName:
    Type: String
    Default: BackendAppData
    Description: DynamoDB table name

Resources:
  BackendDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: Backend-App-Data

Outputs:
  BackendDynamoDBTableName:
    Value: !Ref BackendDynamoDBTable
    Export:
      Name: Dev-BackendDynamoDBTableName

  BackendDynamoDBTableArn:
    Value: !GetAtt BackendDynamoDBTable.Arn
    Export:
      Name: Dev-BackendDynamoDBTableArn
